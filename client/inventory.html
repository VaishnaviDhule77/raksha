<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAKSHA — Food Inventory</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Base styles & layout */
    :root {
      --primary: #2b6cb0;
      --primary-hover: #2c5282;
      --danger: #e53e3e;
      --danger-hover: #c53030;
      --warn: #dd6b20;
      --bg-main: #f7fafc;
      --border-color: #e2e8f0;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: #2d3748;
    }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 1rem;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: inherit;
    }
    .topbar-status {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Chips & Connectivity Pill */
    .chip {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .chip-off { background: #edf2f7; color: #4a5568; }
    .chip-live { background: #c6f6d5; color: #22543d; }
    .chip-demo { background: #feebc8; color: #744210; }
    .chip-sync { background: #e9d8fd; color: #44337a; }

    .conn-pill {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #38a169;
    }

    /* Sidebar & Layout */
    .has-sidebar { display: flex; min-height: calc(100vh - 60px); }
    .sidebar {
      width: 240px;
      background: #ffffff;
      border-right: 1px solid var(--border-color);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sidebar ul { list-style: none; padding: 0; margin: 0 0 1.5rem 0; }
    .sidebar-label { font-size: 0.75rem; text-transform: uppercase; color: #a0aec0; margin-bottom: 0.5rem; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      color: #4a5568;
      text-decoration: none;
      border-radius: 6px;
    }
    .nav-link.active, .nav-link:hover { background: #ebf8ff; color: var(--primary); }

    /* Main Content & Table */
    main { flex: 1; padding: 1.5rem; }
    .table-container { background: #fff; border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); }
    th { background: #f7fafc; font-weight: 600; color: #4a5568; }
    td.num { text-align: right; }

    /* Buttons & Badges */
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    .btn-danger { background: var(--danger); color: #fff; border: none; }
    .btn-danger-ghost { color: var(--danger); background: transparent; border: none; }
    .badge { padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.75rem; }
    .prio-critical { background: #fed7d7; color: #9b2c2c; }
    .prio-high { background: #feebc8; color: #744210; }
    .prio-medium { background: #e2e8f0; color: #2d3748; }
    .prio-low { background: #edf2f7; color: #718096; }

    .ra-pending-chip {
      margin-left: 0.5rem;
      font-size: 0.7rem;
      background: #edf2f7;
      padding: 2px 6px;
      border-radius: 4px;
      color: #718096;
    }

    /* Dialog/Modal */
    .modal { border: none; border-radius: 8px; padding: 1.5rem; max-width: 500px; width: 100%; }
    .modal::backdrop { background: rgba(0,0,0,0.4); }
  </style>
</head>
<body data-page="inventory">

  <div id="ra-topbar-root"></div>

  <div class="has-sidebar">
    <div id="ra-sidebar-root"></div>

    <main id="main">
      <div class="toolbar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <div>
          <h2>Food Inventory</h2>
          <p id="inv-meta" class="hint" style="color:#718096; font-size:0.85rem;"></p>
        </div>
        <button id="btn-add-food" class="btn" style="background:var(--primary); color:#fff;">+ Add Food Item</button>
      </div>

      <div class="filters" style="display:flex; gap:0.5rem; margin-bottom:1rem;">
        <input type="text" id="inv-search" class="btn" placeholder="Search food items..." style="flex:1;" />
        <select id="inv-cat" class="btn">
          <option value="">All Categories</option>
          <option value="Cooked">Cooked</option>
          <option value="Dairy">Dairy</option>
          <option value="Vegetables">Vegetables</option>
          <option value="Meat">Meat</option>
          <option value="Frozen">Frozen</option>
          <option value="Grains">Grains</option>
          <option value="Canned">Canned</option>
        </select>
        <select id="inv-status" class="btn">
          <option value="">All Statuses</option>
          <option value="CRITICAL">CRITICAL</option>
          <option value="PRIORITY">PRIORITY</option>
          <option value="PROTECT">PROTECT</option>
          <option value="STABLE">STABLE</option>
        </select>
      </div>

      <p id="inv-count" style="font-size:0.85rem; color:#4a5568; margin-bottom:0.5rem;"></p>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Food</th>
              <th>Category</th>
              <th class="num">Quantity</th>
              <th>Unit</th>
              <th>Storage Type</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="food-tbody">
            <!-- Dynamic content -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Food Item Modal -->
  <dialog id="food-dialog" class="modal">
    <form id="food-form" method="dialog">
      <h3 id="food-dialog-title" style="margin-top:0;">Add Food Item</h3>
      <div style="display:flex; flex-direction:column; gap:0.75rem; margin-bottom:1rem;">
        <label>
          Item Name
          <input type="text" id="f-name" class="btn" style="width:100%; box-sizing:border-box;" required />
        </label>
        <div style="display:flex; gap:0.5rem;">
          <label style="flex:1;">
            Category
            <select id="f-category" class="btn" style="width:100%;">
              <option value="Cooked">Cooked</option>
              <option value="Dairy">Dairy</option>
              <option value="Vegetables" selected>Vegetables</option>
              <option value="Meat">Meat</option>
              <option value="Frozen">Frozen</option>
              <option value="Grains">Grains</option>
              <option value="Canned">Canned</option>
            </select>
          </label>
          <label style="flex:1;">
            Storage Type
            <select id="f-storage" class="btn" style="width:100%;">
              <option value="Ambient" selected>Ambient</option>
              <option value="Refrigerated">Refrigerated</option>
              <option value="Frozen">Frozen</option>
            </select>
          </label>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <label style="flex:1;">
            Quantity
            <input type="number" id="f-qty" class="btn" style="width:100%; box-sizing:border-box;" required min="0" step="any" />
          </label>
          <label style="flex:1;">
            Unit
            <select id="f-unit" class="btn" style="width:100%;">
              <option value="kg" selected>kg</option>
              <option value="L">L</option>
              <option value="units">units</option>
            </select>
          </label>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <label style="flex:1;">
            Status
            <select id="f-status" class="btn" style="width:100%;">
              <option value="CRITICAL">CRITICAL</option>
              <option value="PRIORITY">PRIORITY</option>
              <option value="PROTECT" selected>PROTECT</option>
              <option value="STABLE">STABLE</option>
            </select>
          </label>
          <label style="flex:1;">
            Priority
            <select id="f-priority" class="btn" style="width:100%;">
              <option value="Critical">Critical</option>
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </label>
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" id="food-submit" class="btn" style="background:var(--primary); color:#fff;">Save Item</button>
      </div>
    </form>
  </dialog>

  <!-- Core Scripts -->
  <script>
    /* ================================================================
       RAKSHA — Core UI & Navigation Infrastructure
       ================================================================ */
    window.RAKSHA = window.RAKSHA || {};
    (function () {
      'use strict';
      var R = window.RAKSHA;
      R.version = '1.0.0';

      var readyFns = [];
      R.onReady = function (fn) {
        if (document.readyState !== 'loading') fn();
        else readyFns.push(fn);
      };
      document.addEventListener('DOMContentLoaded', function () {
        readyFns.forEach(function (fn) { fn(); });
      });

      R.dispatch = function (event, detail) {
        window.dispatchEvent(new CustomEvent(event, { detail: detail }));
      };

      var NAV = [
        {
          group: 'Core',
          items: [
            { key: 'inventory', label: 'Food Inventory', href: 'index.html', icon: 'box' },
            { key: 'resources', label: 'Resources', href: 'resources.html', icon: 'zap' },
            { key: 'planner', label: 'Decision Support', href: 'planner.html', icon: 'cpu' }
          ]
        }
      ];

      R.ui = {
        esc: function (str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        },
        fmtNum: function (n) {
          return Number(n || 0).toLocaleString();
        },
        debounce: function (fn, wait) {
          var t;
          return function () {
            var ctx = this, args = arguments;
            clearTimeout(t);
            t = setTimeout(function () { fn.apply(ctx, args); }, wait);
          };
        },
        icon: function (type) {
          return '<span class="icon icon-' + type + '" aria-hidden="true"></span>';
        },
        statusBadge: function (status) {
          var cls = 'badge prio-low';
          if (status === 'CRITICAL') cls = 'badge prio-critical';
          if (status === 'PRIORITY') cls = 'badge prio-high';
          if (status === 'PROTECT') cls = 'badge prio-medium';
          return '<span class="' + cls + '">' + R.ui.esc(status) + '</span>';
        },
        toast: function (msg, type) {
          var el = document.createElement('div');
          el.className = 'toast toast-' + (type || 'info');
          el.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:12px 16px;background:#323232;color:#fff;border-radius:4px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.2)';
          if (type === 'error') el.style.background = '#e53e3e';
          if (type === 'warn') el.style.background = '#dd6b20';
          if (type === 'success') el.style.background = '#38a169';
          el.textContent = msg;
          document.body.appendChild(el);
          setTimeout(function () { el.remove(); }, 4000);
        },
        confirm: function (opts) {
          return new Promise(function (resolve) {
            var dialog = document.getElementById('ra-confirm');
            if (!dialog) { resolve(confirm(opts.message)); return; }
            document.getElementById('ra-confirm-title').textContent = opts.title || 'Confirm Action';
            document.getElementById('ra-confirm-msg').textContent = opts.message || '';
            var okBtn = document.getElementById('ra-confirm-ok');
            okBtn.textContent = opts.confirmLabel || 'Confirm';

            function onCleanup(result) {
              dialog.close();
              dialog.removeEventListener('close', onClose);
              resolve(result);
            }
            function onClose() {
              onCleanup(dialog.returnValue === 'confirm');
            }
            dialog.addEventListener('close', onClose, { once: true });
            dialog.showModal();
          });
        }
      };

      function topbarHTML() {
        return '' +
          '<header class="topbar" id="ra-topbar">' +
            '<button class="icon-btn" id="ra-menu-btn" aria-label="Open navigation menu" aria-expanded="false">' + R.ui.icon('menu') + '</button>' +
            '<a class="topbar-brand" href="index.html">' +
              '<span class="brand-mark">' + R.ui.icon('shield') + '</span>' +
              '<span class="brand-text"><strong>RAKSHA</strong><small> Food resilience · prototype</small></span>' +
            '</a>' +
            '<div class="topbar-status">' +
              '<span class="chip chip-off" id="ra-data-chip" hidden title="Where the data you are viewing comes from">…</span>' +
              '<span class="chip chip-sync" id="ra-sync-badge" hidden title="Changes waiting to be synchronised">Sync</span>' +
              '<span class="conn-pill on" id="ra-conn-pill" role="status" aria-live="polite" title="Application connectivity">' +
                '<span class="conn-dot" aria-hidden="true"></span><span id="ra-conn-label">ONLINE</span>' +
              '</span>' +
              '<button class="sim-btn btn btn-sm" id="ra-force-offline" data-ra-force-offline type="button" ' +
                'title="Demo control: makes the app behave as if the internet is unavailable">Simulate Internet Loss</button>' +
            '</div>' +
          '</header>';
      }

      function sidebarHTML() {
        var page = document.body.getAttribute('data-page');
        var html = '<nav class="sidebar" id="ra-sidebar" aria-label="Primary navigation">';
        NAV.forEach(function (g) {
          html += '<p class="sidebar-label">' + g.group + '</p><ul>';
          g.items.forEach(function (it) {
            var active = it.key === page;
            html += '<li><a class="nav-link' + (active ? ' active' : '') + '" href="' + it.href + '"' +
              (active ? ' aria-current="page"' : '') + '>' + R.ui.icon(it.icon) + '<span>' + it.label + '</span></a></li>';
          });
          html += '</ul>';
        });
        html += '<div class="sidebar-foot">' +
            '<p class="sidebar-note" style="font-size:0.75rem; color:#a0aec0;">Prototype decision-support tool. RAKSHA does not guarantee food safety.</p>' +
            '<p class="sidebar-ver" style="font-size:0.75rem; font-weight:bold; color:#718096;">RAKSHA v' + R.version + '</p>' +
          '</div></nav>';
        return html;
      }

      function renderShell() {
        var topRoot = document.getElementById('ra-topbar-root');
        if (topRoot) { topRoot.classList.add('slot-topbar'); topRoot.innerHTML = topbarHTML(); }
        var sideRoot = document.getElementById('ra-sidebar-root');
        var hasSidebar = !!sideRoot;
        document.body.classList.toggle('has-sidebar', hasSidebar);
        if (sideRoot) {
          sideRoot.classList.add('slot-sidebar');
          sideRoot.innerHTML = sidebarHTML();
          var scrim = document.createElement('div');
          scrim.className = 'scrim'; scrim.id = 'ra-scrim'; scrim.hidden = true;
          document.body.appendChild(scrim);
        }
        var menuBtn = document.getElementById('ra-menu-btn');
        var scrimEl = document.getElementById('ra-scrim');
        if (!hasSidebar && menuBtn) { menuBtn.style.display = 'none'; }
        function closeSidebar() {
          document.body.classList.remove('sidebar-open');
          if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
          if (scrimEl) scrimEl.hidden = true;
        }
        if (menuBtn && hasSidebar) {
          menuBtn.addEventListener('click', function () {
            var open = document.body.classList.toggle('sidebar-open');
            menuBtn.setAttribute('aria-expanded', String(open));
            if (scrimEl) scrimEl.hidden = !open;
          });
        }
        if (scrimEl) scrimEl.addEventListener('click', closeSidebar);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && document.body.classList.contains('sidebar-open')) closeSidebar();
        });
      }

      function injectConfirmDialog() {
        if (document.getElementById('ra-confirm')) return;
        var d = document.createElement('dialog');
        d.id = 'ra-confirm'; d.className = 'modal modal-sm';
        d.innerHTML =
          '<h2 class="confirm-title" id="ra-confirm-title" style="margin-top:0;"></h2>' +
          '<p class="confirm-msg" id="ra-confirm-msg"></p>' +
          '<div class="modal-actions" style="display:flex; justify-content:flex-end; gap:0.5rem;">' +
            '<button value="cancel" class="btn">Cancel</button>' +
            '<button value="confirm" id="ra-confirm-ok" class="btn btn-danger">Confirm</button>' +
          '</div>';
        document.body.appendChild(d);
      }

      function updateDataChip(detail) {
        var chip = document.getElementById('ra-data-chip');
        if (!chip) return;
        var online = R.offline ? R.offline.isOnline() : navigator.onLine;
        var mode = detail && detail.mode ? detail.mode : (R.api ? R.api.mode : 'demo');
        chip.hidden = false;
        if (!online) { chip.className = 'chip chip-off'; chip.textContent = 'OFFLINE DATA'; chip.title = 'No connection — data is served from the offline cache on this device.'; }
        else if (mode === 'live') { chip.className = 'chip chip-live'; chip.textContent = 'LIVE DATA'; chip.title = 'Connected to the RAKSHA backend.'; }
        else { chip.className = 'chip chip-demo'; chip.textContent = 'DEMO DATA'; chip.title = 'Backend not connected — running on the built-in demo dataset.'; }
      }

      function injectDemoBanner(show) {
        var main = document.getElementById('main');
        if (!main) return;
        var b = document.getElementById('ra-demo-banner');
        if (show) {
          if (!b) {
            b = document.createElement('div');
            b.id = 'ra-demo-banner'; b.className = 'alert alert-warn'; b.setAttribute('role', 'note');
            b.style.cssText = 'background:#feebc8; color:#744210; padding:10px 14px; border-radius:6px; margin-bottom:1rem; font-size:0.85rem;';
            b.innerHTML = '<strong>Demo data mode.</strong> The RAKSHA backend is not connected, so this app is running on its built-in demo dataset (Demo Village). Offline edits are queued and will sync when the server is reachable.';
            main.prepend(b);
          }
        } else if (b) { b.remove(); }
      }

      function registerSW() {
        if (!('serviceWorker' in navigator)) return;
        var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!(location.protocol === 'https:' || local)) return;
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('[RAKSHA] Service Worker registration failed:', err);
        });
      }

      renderShell();
      injectConfirmDialog();
      registerSW();
      updateDataChip({ mode: 'demo' });

      window.addEventListener('ra:apimode', function (e) {
        updateDataChip(e.detail);
        injectDemoBanner(e.detail && e.detail.mode === 'demo');
      });
      window.addEventListener('ra:connectivity', function () { updateDataChip(); });
    })();

    /* ================================================================
       RAKSHA — API layer for food inventory
       ================================================================ */
    (function () {
      'use strict';
      var R = window.RAKSHA;

      var API_BASE = '/api';
      var LS_KEY = 'raksha.demo.v1';
      var DEMO_COMMUNITY_ID = "650c1f1e2f8a1b0012345678";

      var api = R.api = { mode: 'demo', lastSource: null };

      var SEED_FOOD = [
        { id: 'food-001', name: 'Cooked food (rice & curry)', category: 'Cooked',     quantity: 30, unit: 'kg', storageType: 'Refrigerated', status: 'PRIORITY',  priority: 'High' },
        { id: 'food-002', name: 'Milk',                       category: 'Dairy',      quantity: 20, unit: 'L',  storageType: 'Refrigerated', status: 'CRITICAL', priority: 'Critical' },
        { id: 'food-003', name: 'Fresh vegetables',           category: 'Vegetables', quantity: 40, unit: 'kg', storageType: 'Ambient',      status: 'PROTECT',  priority: 'Medium' },
        { id: 'food-004', name: 'Meat & fish',                category: 'Meat',       quantity: 20, unit: 'kg', storageType: 'Frozen',       status: 'CRITICAL', priority: 'Critical' },
        { id: 'food-005', name: 'Frozen food',                category: 'Frozen',     quantity: 30, unit: 'kg', storageType: 'Frozen',       status: 'PRIORITY', priority: 'High' },
        { id: 'food-006', name: 'Rice & grains',              category: 'Grains',     quantity: 80, unit: 'kg', storageType: 'Ambient',      status: 'STABLE',   priority: 'Low' },
        { id: 'food-007', name: 'Canned food',                category: 'Canned',     quantity: 50, unit: 'kg', storageType: 'Ambient',      status: 'STABLE',   priority: 'Low' }
      ];

      var SEED_RESOURCES = [
        { id: 'res-001', name: 'Refrigerator A', type: 'Refrigerator', capacity: 50, unit: 'kg',   location: 'Community hall – kitchen',    powerSource: 'Grid',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community', poweredByGenerator: true },
        { id: 'res-002', name: 'Refrigerator B', type: 'Refrigerator', capacity: 50, unit: 'kg',   location: 'Shelter block C',             powerSource: 'Grid',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community', poweredByGenerator: false },
        { id: 'res-003', name: 'Freezer',        type: 'Freezer',      capacity: 40, unit: 'kg',   location: 'Community hall – kitchen',    powerSource: 'Grid',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community', poweredByGenerator: true },
        { id: 'res-004', name: 'Cold box',       type: 'Cold box',     capacity: 20, unit: 'kg',   location: 'Mobile / shelter block C',    powerSource: 'Ice',   operationalStatus: 'Operational', availability: 'Available', ownerType: 'NGO',       poweredByGenerator: false },
        { id: 'res-005', name: 'Generator',      type: 'Generator',    capacity: 1,  unit: 'units', location: 'Community hall',              powerSource: 'Fuel',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community' },
        { id: 'res-006', name: 'Ice stock',      type: 'Ice supply',   capacity: 20, unit: 'kg',   location: 'Community hall freezer room', powerSource: 'None',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community' }
      ];

      function loadDemoState() {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) { /* ignore */ }
        return {
          food: JSON.parse(JSON.stringify(SEED_FOOD)),
          resources: JSON.parse(JSON.stringify(SEED_RESOURCES)),
          runs: {}, plans: {}, lastRunId: null, lastPlanRunId: null, seq: 100
        };
      }
      var demo = loadDemoState();
      function saveDemoState() { try { localStorage.setItem(LS_KEY, JSON.stringify(demo)); } catch (e) { /* ignore */ } }
      function clone(o) { return JSON.parse(JSON.stringify(o)); }

      function fireMode() { R.dispatch('ra:apimode', { mode: api.mode }); }

      function request(method, path, body) {
        return fetch(API_BASE + path, {
          method: method,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined
        }).then(function (res) {
          if (!res.ok) {
            return res.json().catch(function () { return {}; }).then(function (j) {
              throw new Error((j && j.error) || ('Request failed (' + res.status + ')'));
            });
          }
          return res.json();
        });
      }

      // Invalidate stale snapshots upon re-establishing connectivity
      window.addEventListener('ra:connectivity', function (e) {
        if (e.detail && e.detail.online) {
          api.mode = 'live';
          if (R.offline && R.offline.cacheSnapshot) {
            R.offline.cacheSnapshot('inventory', null);
          }
          fireMode();
        }
      });

      function offlineWrite(operation, id, data, demoMutator) {
        var payload = Object.assign({}, data, { communityId: DEMO_COMMUNITY_ID });
        var p = (R.offline && R.offline.writeQueued)
          ? R.offline.writeQueued('food_items', operation, id, payload)
          : Promise.resolve();
        if (api.mode === 'demo' && demoMutator) {
          try { demoMutator(); saveDemoState(); } catch (e) { /* ignore */ }
        }
        return p;
      }

      api.getFoodItems = function () {
        var isOnline = R.offline ? R.offline.isOnline() : navigator.onLine;
        if (isOnline) {
          return request('GET', '/food-items?communityId=' + DEMO_COMMUNITY_ID)
            .then(function (data) {
              api.mode = 'live';
              api.lastSource = 'live';
              fireMode();
              if (R.offline && R.offline.cacheSnapshot) {
                R.offline.cacheSnapshot('inventory', data);
              }
              return data;
            })
            .catch(function () {
              api.mode = 'demo';
              fireMode();
              return fallback();
            });
        }
        return fallback();

        function fallback() {
          if (R.offline && R.offline.loadSnapshot) {
            return R.offline.loadSnapshot('inventory').then(function (cached) {
              if (cached != null) { api.lastSource = 'cache'; return cached; }
              return clone(demo.food);
            });
          }
          return Promise.resolve(clone(demo.food));
        }
      };

      api.createFoodItem = function (data) {
        var isOnline = R.offline ? R.offline.isOnline() : navigator.onLine;
        if (!isOnline) {
          return offlineWrite('create', null, data, function () {
            var item = Object.assign({ id: 'food-' + (demo.seq++) }, data, { updatedAt: new Date().toISOString() });
            demo.food.push(item);
            return clone(item);
          });
        }
        return request('POST', '/food-items', Object.assign({ communityId: DEMO_COMMUNITY_ID }, data));
      };

      api.updateFoodItem = function (id, data) {
        var isOnline = R.offline ? R.offline.isOnline() : navigator.onLine;
        if (!isOnline) {
          return offlineWrite('update', id, data, function () {
            var item = demo.food.filter(function (f) { return (f._id || f.id) === id; })[0];
            if (item) Object.assign(item, data, { id: id, updatedAt: new Date().toISOString() });
            return clone(item || data);
          });
        }
        return request('PUT', '/food-items/' + id, data);
      };

      api.deleteFoodItem = function (id) {
        var isOnline = R.offline ? R.offline.isOnline() : navigator.onLine;
        if (!isOnline) {
          return offlineWrite('delete', id, null, function () {
            demo.food = demo.food.filter(function (f) { return (f._id || f.id) !== id; });
            return { ok: true };
          });
        }
        return request('DELETE', '/food-items/' + id);
      };

      api.resetDemoData = function () {
        try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
        location.reload();
      };
    })();

    /* ================================================================
       RAKSHA — Inventory Controller
       ================================================================ */
    (function () {
      'use strict';
      var R = window.RAKSHA;
      var api = R.api, ui = R.ui;

      function prioBadge(p) { return '<span class="badge prio-' + String(p).toLowerCase() + '">' + ui.esc(p) + '</span>'; }

      var items = [];
      var filters = { q: '', category: '', status: '' };
      var editingId = null;
      var dialog = document.getElementById('food-dialog');
      var form = document.getElementById('food-form');
      var pending = {};

      function filtered() {
        return items.filter(function (f) {
          if (filters.category && f.category !== filters.category) return false;
          if (filters.status && f.status !== filters.status) return false;
          if (filters.q && f.name.toLowerCase().indexOf(filters.q.toLowerCase()) === -1) return false;
          return true;
        });
      }

      function pendingChip(op) {
        if (!op) return '';
        var label = op.status === 'conflict' ? 'sync conflict' : (op.operation === 'create' ? 'new · pending sync' : op.operation + ' · pending sync');
        return '<span class="ra-pending-chip">' + ui.esc(label) + '</span>';
      }

      function render() {
        var list = filtered();
        var tbody = document.getElementById('food-tbody');
        if (!tbody) return;
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="8" class="hint" style="text-align:center;padding:28px">' +
            'No food items match your filters.</td></tr>';
        } else {
          tbody.innerHTML = list.map(function (f) {
            var id = f._id || f.id;
            var op = pending[id];
            return '<tr>' +
              '<td data-label="Food"><span class="cell-strong">' + ui.esc(f.name) + '</span>' + pendingChip(op) + '</td>' +
              '<td data-label="Category">' + ui.esc(f.category) + '</td>' +
              '<td data-label="Quantity" class="num">' + ui.fmtNum(f.quantity) + '</td>' +
              '<td data-label="Unit">' + ui.esc(f.unit) + '</td>' +
              '<td data-label="Storage type">' + ui.esc(f.storageType) + '</td>' +
              '<td data-label="Status">' + ui.statusBadge(f.status) + '</td>' +
              '<td data-label="Priority">' + prioBadge(f.priority) + '</td>' +
              '<td data-label="Actions"><div class="row-actions">' +
                '<button class="btn btn-sm act-edit" data-id="' + ui.esc(id) + '">' + ui.icon('edit') + 'Edit</button> ' +
                '<button class="btn btn-sm btn-danger-ghost act-del" data-id="' + ui.esc(id) + '">' + ui.icon('trash') + 'Delete</button>' +
              '</div></td></tr>';
          }).join('');
        }

        var kg = 0, litres = 0;
        list.forEach(function (f) {
          if (f.unit === 'kg') kg += f.quantity;
          else if (f.unit === 'L') litres += f.quantity;
        });
        var totals = [kg ? ui.fmtNum(kg) + ' kg' : '', litres ? ui.fmtNum(litres) + ' L' : '']
          .filter(Boolean).join(' · ') || '0 kg';
        var queued = Object.keys(pending).length;

        var countEl = document.getElementById('inv-count');
        if (countEl) {
          countEl.textContent = 'Showing ' + list.length + ' of ' + items.length + ' items · ' + totals +
            (queued ? ' · ' + queued + ' queued offline' : '');
        }
        var metaEl = document.getElementById('inv-meta');
        if (metaEl) {
          var isOnline = R.offline ? R.offline.isOnline() : navigator.onLine;
          metaEl.textContent = items.length + ' food items recorded for this community' +
            (!isOnline ? ' · offline (cached + queued edits)' : '');
        }
      }

      function openDialog(item) {
        editingId = item ? (item._id || item.id) : null;
        if (form) form.reset();
        document.getElementById('food-dialog-title').textContent = item ? 'Edit food item' : 'Add food item';
        document.getElementById('food-submit').textContent = item ? 'Save changes' : 'Save item';
        document.getElementById('f-name').value = item ? item.name : '';
        document.getElementById('f-category').value = item ? item.category : 'Vegetables';
        document.getElementById('f-storage').value = item ? item.storageType : 'Ambient';
        document.getElementById('f-qty').value = item ? item.quantity : '';
        document.getElementById('f-unit').value = item ? item.unit : 'kg';
        document.getElementById('f-status').value = item ? item.status : 'PROTECT';
        document.getElementById('f-priority').value = item ? item.priority : 'Medium';
        if (dialog) dialog.showModal();
        document.getElementById('f-name').focus();
      }

      function load() {
        var pendingPromise = (R.sync && R.sync.pendingByCollection)
          ? R.sync.pendingByCollection('food_items')
          : Promise.resolve({});
        return Promise.all([api.getFoodItems(), pendingPromise]).then(function (r) {
          items = r[0] || [];
          pending = r[1] || {};
          render();
        });
      }

      R.onReady(function () {
        var btnAdd = document.getElementById('btn-add-food');
        if (btnAdd) btnAdd.addEventListener('click', function () { openDialog(null); });

        var searchEl = document.getElementById('inv-search');
        if (searchEl) {
          searchEl.addEventListener('input', ui.debounce(function (e) {
            filters.q = e.target.value.trim(); render();
          }, 180));
        }
        var catEl = document.getElementById('inv-cat');
        if (catEl) catEl.addEventListener('change', function (e) { filters.category = e.target.value; render(); });

        var statusEl = document.getElementById('inv-status');
        if (statusEl) statusEl.addEventListener('change', function (e) { filters.status = e.target.value; render(); });

        if (dialog) {
          dialog.querySelectorAll('[data-close]').forEach(function (b) {
            b.addEventListener('click', function () { dialog.close(); });
          });
          dialog.addEventListener('click', function (e) { if (e.target === dialog) dialog.close(); });
        }

        if (form) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (!form.checkValidity()) { form.reportValidity(); return; }
            var payload = {
              name: document.getElementById('f-name').value.trim(),
              category: document.getElementById('f-category').value,
              storageType: document.getElementById('f-storage').value,
              quantity: Number(document.getElementById('f-qty').value),
              unit: document.getElementById('f-unit').value,
              status: document.getElementById('f-status').value,
              priority: document.getElementById('f-priority').value,
              updatedAt: new Date().toISOString()
            };
            var submitBtn = document.getElementById('food-submit');
            submitBtn.classList.add('is-busy');

            var isOnline = R.offline ? R.offline.isOnline() : navigator.onLine;
            var op = editingId ? api.updateFoodItem(editingId, payload) : api.createFoodItem(payload);

            op.then(function (res) {
              if (dialog) dialog.close();
              if (!isOnline) {
                if (editingId) {
                  var existing = items.filter(function (f) { return (f._id || f.id) === editingId; })[0];
                  if (existing) Object.assign(existing, payload);
                } else {
                  var newItem = Object.assign({ id: (res && res.id) || ('temp-' + Date.now()) }, payload);
                  items.push(newItem);
                }
                ui.toast('“' + payload.name + '” saved offline — queued for sync. It will reach MongoDB when the connection returns.', 'warn');
              } else {
                ui.toast('“' + payload.name + '” ' + (editingId ? 'updated' : 'added to the inventory') + '.', 'success');
              }
              return load();
            }).catch(function (err) {
              ui.toast(err.message || 'Failed to save item', 'error');
            }).finally(function () {
              submitBtn.classList.remove('is-busy');
            });
          });
        }

        var tbody = document.getElementById('food-tbody');
        if (tbody) {
          tbody.addEventListener('click', function (e) {
            var editBtn = e.target.closest('.act-edit');
            var delBtn = e.target.closest('.act-del');
            var isOnline = R.offline ? R.offline.isOnline() : navigator.onLine;

            if (editBtn) {
              var targetId = editBtn.getAttribute('data-id');
              var item = items.filter(function (f) { return (f._id || f.id) === targetId; })[0];
              if (item) openDialog(item);
            } else if (delBtn) {
              var id = delBtn.getAttribute('data-id');
              var target = items.filter(function (f) { return (f._id || f.id) === id; })[0];
              if (!target) return;

              ui.confirm({
                title: 'Delete food item?',
                message: '“' + target.name + '” will be removed' +
                  (!isOnline ? ' locally and the deletion queued for sync' : '') +
                  '. This cannot be undone.',
                confirmLabel: 'Delete', danger: true
              }).then(function (ok) {
                if (!ok) return;
                api.deleteFoodItem(id).then(function () {
                  if (!isOnline) {
                    items = items.filter(function (f) { return (f._id || f.id) !== id; });
                  }
                  ui.toast(!isOnline
                    ? '“' + target.name + '” deleted offline — deletion queued for sync.'
                    : '“' + target.name + '” deleted.', !isOnline ? 'warn' : 'success');
                  return load();
                }).catch(function (err) { ui.toast(err.message || 'Failed to delete item', 'error'); });
              });
            }
          });
        }

        window.addEventListener('ra:sync-queue', function () {
          if (R.offline && R.offline.cacheSnapshot) {
            R.offline.cacheSnapshot('inventory', null);
          }
          load();
        });

        window.addEventListener('ra:connectivity', function () {
          if (R.offline && R.offline.cacheSnapshot) {
            R.offline.cacheSnapshot('inventory', null);
          }
          load();
        });

        load().catch(function (err) { ui.toast('Could not load inventory: ' + err.message, 'error'); });
      });
    })();
  </script>

  <!-- Shared offline + sync layers -->
  <script src="js/offline.js"></script>
  <script src="js/sync.js"></script>
</body>
