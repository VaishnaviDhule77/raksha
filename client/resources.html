<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Resources · RAKSHA</title>
  <meta name="description" content="Community storage resources — RAKSHA prototype.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0F212B">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    /* ============ RAKSHA community resources — self-contained styles ============ */
    @font-face { font-family: 'Sora'; src: url('fonts/sora-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Sora'; src: url('fonts/sora-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Public Sans'; src: url('fonts/public-sans-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Public Sans'; src: url('fonts/public-sans-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Public Sans'; src: url('fonts/public-sans-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }

    :root {
      --bg: #F4F1EA; --surface: #FFFFFF; --surface-2: #FAF8F2;
      --ink: #182830; --ink-2: #3D4E58; --muted: #5F7079;
      --line: #E3DFD4; --line-strong: #CFC9BA;
      --brand: #0E7568; --brand-strong: #0B5E53; --brand-soft: #E9F2EF;
      --amber: #9A5B00; --amber-soft: #FBEFDD;
      --red: #A61B1B; --red-soft: #FBE7E4;
      --green: #216B44; --green-soft: #E2F0E6;
      --slate: #41586B; --slate-soft: #E8EDF2;
      --unsafe: #5C1616; --unsafe-soft: #EFD9D6;
      --frame: #0F212B; --frame-line: #23414F; --frame-text: #C6D4DC;
      --radius: 12px; --radius-sm: 8px;
      --shadow-1: 0 1px 2px rgba(23,40,48,.06), 0 1px 3px rgba(23,40,48,.08);
      --shadow-2: 0 4px 10px rgba(23,40,48,.08), 0 14px 36px rgba(23,40,48,.12);
      --font-display: 'Sora', 'Trebuchet MS', 'Segoe UI', sans-serif;
      --font-body: 'Public Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --topbar-h: 58px; --sidebar-w: 264px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font-body); font-size: 14.5px; line-height: 1.55; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; }
    p { margin: 0; }
    ul, ol { margin: 0; padding: 0; }
    a { color: var(--brand); }
    a:hover { color: var(--brand-strong); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .skip-link { position: absolute; left: 12px; top: -48px; z-index: 200; background: var(--frame); color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; transition: top .15s ease; }
    .skip-link:focus { top: 12px; color: #fff; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

    /* shell */
    .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: auto 1fr; grid-template-areas: "topbar topbar" "sidebar main"; min-height: 100vh; }
    .slot-topbar { grid-area: topbar; }
    .slot-sidebar { grid-area: sidebar; }
    .topbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 16px; height: var(--topbar-h); padding: 0 20px; background: var(--frame); color: #E7EEF2; border-bottom: 1px solid var(--frame-line); }
    .topbar-brand { display: flex; align-items: center; gap: 11px; color: #fff; text-decoration: none; margin-right: auto; }
    .brand-mark { width: 32px; height: 32px; border-radius: 9px; flex: none; background: var(--brand); color: #fff; display: grid; place-items: center; }
    .brand-mark svg { width: 19px; height: 19px; }
    .brand-text strong { display: block; font: 700 14.5px var(--font-display); letter-spacing: .14em; }
    .brand-text small { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #93A6B1; }
    .topbar-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn { display: none; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 9px; background: transparent; border: 1px solid var(--frame-line); color: var(--frame-text); cursor: pointer; }
    .icon-btn svg { width: 19px; height: 19px; }
    .icon-btn:hover { color: #fff; border-color: #35586B; }
    .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .chip-live   { background: rgba(64,178,122,.18); color: #8FE3B0; }
    .chip-demo   { background: rgba(199,129,26,.22); color: #E8B36A; }
    .chip-off    { background: rgba(120,144,160,.2); color: #AFC2CD; }
    .chip-sync   { background: rgba(199,129,26,.22); color: #E8B36A; }
    .conn-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .07em; }
    .conn-pill .conn-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .conn-pill.on  { background: rgba(64,178,122,.16); color: #8FE3B0; }
    .conn-pill.on .conn-dot { background: #43C06E; box-shadow: 0 0 0 3px rgba(67,192,110,.18); }
    .conn-pill.off { background: rgba(214,69,56,.18); color: #F1A29B; }
    .conn-pill.off .conn-dot { background: #E4574B; box-shadow: 0 0 0 3px rgba(228,87,75,.18); }
    .conn-pill .sim-tag { font-style: normal; font-size: 9.5px; letter-spacing: .1em; border: 1px solid currentColor; border-radius: 4px; padding: 1px 5px; opacity: .85; }
    .sim-btn { background: transparent; border: 1px solid var(--frame-line); color: var(--frame-text); border-radius: 8px; padding: 7px 11px; font: 600 11.5px var(--font-body); letter-spacing: .03em; cursor: pointer; }
    .sim-btn:hover { color: #fff; border-color: #35586B; }
    .sim-btn.active { border-color: #E4574B; color: #F1A29B; }
    .sidebar { display: flex; flex-direction: column; gap: 4px; background: var(--frame); border-right: 1px solid var(--frame-line); padding: 18px 14px 16px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto; }
    .sidebar-label { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #7A93A1; margin: 10px 12px 6px; }
    .sidebar-label:first-child { margin-top: 0; }
    .nav-link { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 9px; text-decoration: none; color: var(--frame-text); font-weight: 500; font-size: 14px; }
    .nav-link:hover { background: rgba(255,255,255,.05); color: #fff; }
    .nav-link.active { background: rgba(20,148,132,.22); color: #fff; box-shadow: inset 3px 0 0 0 #2FBFA8; }
    .nav-link svg { width: 19px; height: 19px; flex: none; }
    .sidebar-foot { margin-top: auto; padding: 14px 12px 0; border-top: 1px solid var(--frame-line); }
    .sidebar-note { font-size: 11.5px; color: #8FA3AE; line-height: 1.5; }
    .sidebar-ver { font-size: 10.5px; color: #637885; margin-top: 6px; letter-spacing: .05em; }
    .scrim { position: fixed; inset: var(--topbar-h) 0 0 0; background: rgba(10,20,26,.55); z-index: 65; }
    .main { padding: 28px 34px 64px; min-width: 0; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }
    .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); margin-bottom: 5px; }
    .page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
    .page-sub { color: var(--muted); font-size: 14px; margin-top: 4px; max-width: 640px; }
    .page-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* buttons & cards */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 13.5px var(--font-body); text-decoration: none; transition: background .12s ease, border-color .12s ease, transform .05s ease; }
    .btn:hover { background: #FBFAF6; border-color: #B9B29E; color: var(--ink); }
    .btn:active { transform: translateY(1px); }
    .btn svg { width: 15px; height: 15px; }
    .btn-primary { background: var(--brand); border-color: var(--brand-strong); color: #fff; }
    .btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); color: #fff; }
    .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
    .btn-danger-ghost { background: transparent; border-color: #DDBBB6; color: var(--red); }
    .btn-danger-ghost:hover { background: var(--red-soft); border-color: var(--red); color: var(--red); }
    .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
    .btn-sm svg { width: 13px; height: 13px; }
    .btn.is-gated { opacity: .4; cursor: not-allowed; filter: saturate(.35); }
    .btn.is-busy { pointer-events: none; opacity: .65; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 18px 20px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 7px; line-height: 1.5; }

    /* badges & stat chips */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; white-space: nowrap; }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .75; }
    .st-critical { background: var(--red-soft); color: var(--red); }
    .st-priority { background: var(--amber-soft); color: var(--amber); }
    .st-protect  { background: var(--slate-soft); color: var(--slate); }
    .st-stable   { background: var(--green-soft); color: var(--green); }
    .st-unsafe   { background: var(--unsafe-soft); color: var(--unsafe); }
    .stat-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .stat-chips .chip { background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); text-transform: none; letter-spacing: .01em; font-size: 12px; padding: 7px 13px; }
    .stat-chips .chip strong { color: var(--ink); }

    /* table */
    .table-card { padding: 6px 6px 10px; }
    .table-wrap { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .table th { font: 700 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 11px 13px; border-bottom: 1px solid var(--line-strong); background: var(--surface-2); white-space: nowrap; }
    .table td { padding: 11px 13px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .table tbody tr:last-child td { border-bottom: 0; }
    .table tbody tr:hover td { background: #FBFAF5; }
    .cell-strong { font-weight: 600; }
    .cell-sub { display: block; font-size: 11px; color: var(--muted); }
    .num { font-variant-numeric: tabular-nums; }
    .row-actions { display: flex; gap: 7px; white-space: nowrap; }

    /* forms */
    label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: #fff; color: var(--ink); font: 400 13.5px var(--font-body); }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    .form-grid .field { margin-bottom: 13px; }
    .span-2 { grid-column: span 2; }
    .check-label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
    .check-label input { width: 16px; height: 16px; accent-color: var(--brand); }

    /* modal dialogs */
    dialog.modal { border: 0; border-radius: 14px; box-shadow: var(--shadow-2); padding: 0; width: min(580px, calc(100vw - 32px)); color: var(--ink); background: var(--surface); }
    dialog.modal::backdrop { background: rgba(15,33,43,.55); backdrop-filter: blur(2px); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { font-size: 15px; }
    .modal-head .icon-btn { display: inline-flex; border-color: var(--line-strong); color: var(--muted); width: 32px; height: 32px; }
    .modal-head .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface-2); }
    .modal-body { padding: 18px 20px; max-height: 64vh; overflow-y: auto; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 13px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 14px 14px; }
    .modal-sm { width: min(430px, calc(100vw - 32px)); }
    .confirm-title { font-size: 15.5px; padding: 18px 20px 6px; }
    .confirm-msg { padding: 0 20px 4px; color: var(--ink-2); font-size: 13.5px; }

    /* toasts, alerts, offline banner */
    .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 130; display: flex; flex-direction: column; gap: 10px; max-width: min(380px, calc(100vw - 36px)); }
    .toast { display: flex; align-items: flex-start; gap: 12px; background: var(--frame); color: #EDF3F6; padding: 12px 14px; border-radius: 10px; box-shadow: var(--shadow-2); border-left: 3px solid var(--brand); font-size: 13px; line-height: 1.5; animation: toast-in .22s ease; }
    .toast.t-success { border-left-color: #43C06E; }
    .toast.t-warn { border-left-color: #E0A23C; }
    .toast.t-error { border-left-color: #E4574B; }
    .toast-x { background: none; border: 0; color: #9FB2BC; cursor: pointer; padding: 2px; line-height: 1; font-size: 15px; }
    .toast-x:hover { color: #fff; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
    .toast.toast-out { opacity: 0; transition: opacity .25s ease; }
    .alert { display: block; padding: 12px 16px; border-radius: 10px; border: 1px solid transparent; font-size: 13px; margin-bottom: 16px; line-height: 1.55; }
    .alert-warn { background: var(--amber-soft); border-color: #E7CFA9; color: #7A4A05; }
    .alert code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .offline-banner { background: #6B241C; color: #F6E2DD; border-left: 4px solid #E4574B; border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; }
    .offline-banner strong { letter-spacing: .04em; }
    .offline-banner .ob-list { margin-top: 5px; font-size: 12.5px; color: #EFCFC8; }
    .offline-banner .ob-list span { font-weight: 700; color: #F6E2DD; }
    .ic { width: 16px; height: 16px; flex: none; }

    /* responsive */
    @media (max-width: 1080px) {
      .icon-btn { display: inline-flex; }
      .app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
      .sidebar { position: fixed; top: var(--topbar-h); left: 0; bottom: 0; z-index: 70; width: 282px; height: auto; transform: translateX(-105%); transition: transform .24s ease; }
      body.sidebar-open .sidebar { transform: translateX(0); box-shadow: var(--shadow-2); }
    }
    @media (max-width: 860px) {
      .main { padding: 22px 20px 56px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .span-2 { grid-column: span 1; }
    }
    @media (max-width: 720px) {
      .page-head { flex-direction: column; align-items: flex-start; }
      .table thead { display: none; }
      .table, .table tbody, .table tr, .table td { display: block; width: 100%; }
      .table tr { border: 1px solid var(--line); border-radius: 10px; margin: 0 6px 10px; padding: 6px 14px; background: var(--surface); }
      .table tbody tr:hover td { background: transparent; }
      .table td { display: flex; justify-content: space-between; align-items: center; gap: 16px; border: 0; border-bottom: 1px dashed var(--line); padding: 8px 0; text-align: right; }
      .table td:last-child { border-bottom: 0; }
      .table td::before { content: attr(data-label); font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: left; }
      .row-actions { justify-content: flex-end; }
      .brand-text small { display: none; }
    }
    @media (max-width: 520px) { .sim-btn { display: none; } .topbar { gap: 10px; padding: 0 14px; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body data-page="resources">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app">
    <div id="ra-topbar-root"></div>
    <div id="ra-sidebar-root"></div>

    <main id="main" class="main">
      <section class="page-head">
        <div>
          <p class="eyebrow">Community resources</p>
          <h1>Storage &amp; backup resources</h1>
          <p class="page-sub" id="res-meta">Loading…</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="btn-add-res" data-requires-online type="button">Add resource</button>
        </div>
      </section>

      <section class="stat-chips" id="res-chips" aria-label="Resource summary"></section>

      <section class="card table-card">
        <div class="table-wrap">
          <table class="table" id="res-table">
            <caption class="sr-only">Community resources with type, capacity, location, power source, status, availability and owner</caption>
            <thead>
              <tr>
                <th scope="col">Resource</th><th scope="col">Type</th><th scope="col">Capacity</th>
                <th scope="col">Location</th><th scope="col">Power source</th><th scope="col">Status</th>
                <th scope="col">Availability</th><th scope="col">Owner</th><th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="res-tbody"><tr><td colspan="9" class="hint" style="text-align:center;padding:28px">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>

      <dialog class="modal" id="res-dialog" aria-labelledby="res-dialog-title">
        <form id="res-form" novalidate>
          <div class="modal-head">
            <h2 id="res-dialog-title">Add resource</h2>
            <button type="button" class="icon-btn" data-close aria-label="Close dialog">×</button>
          </div>
          <div class="modal-body form-grid">
            <div class="field span-2">
              <label for="r-name">Resource name</label>
              <input id="r-name" type="text" required maxlength="60" autocomplete="off">
            </div>
            <div class="field">
              <label for="r-type">Type</label>
              <select id="r-type">
                <option>Refrigerator</option><option>Freezer</option><option>Cold box</option>
                <option>Ice supply</option><option>Generator</option><option>Dry storage</option>
                <option>Community kitchen</option><option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="r-capacity">Capacity</label>
              <input id="r-capacity" type="number" min="0" step="0.1" required>
            </div>
            <div class="field">
              <label for="r-unit">Unit</label>
              <select id="r-unit"><option>kg</option><option>units</option><option>kW</option></select>
            </div>
            <div class="field">
              <label for="r-power">Power source</label>
              <select id="r-power"><option>Grid</option><option>Generator</option><option>Fuel</option><option>Solar</option><option>Ice</option><option>None</option></select>
            </div>
            <div class="field span-2">
              <label for="r-location">Location</label>
              <input id="r-location" type="text" maxlength="80" placeholder="e.g. Community hall – kitchen">
            </div>
            <div class="field">
              <label for="r-opstatus">Operational status</label>
              <select id="r-opstatus"><option>Operational</option><option>Maintenance</option><option>Non-functional</option></select>
            </div>
            <div class="field">
              <label for="r-avail">Availability</label>
              <select id="r-avail"><option>Available</option><option>In use</option><option>Reserved</option></select>
            </div>
            <div class="field">
              <label for="r-owner">Owner type</label>
              <select id="r-owner"><option>Community</option><option>Household</option><option>NGO</option><option>Government</option><option>Private</option></select>
            </div>
            <div class="field span-2">
              <label class="check-label">
                <input type="checkbox" id="r-gen">
                <span>Can run on the generator circuit during a power outage</span>
              </label>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn" data-close>Cancel</button>
            <button type="submit" class="btn btn-primary" id="res-submit">Save resource</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script>
  /* ================================================================
     RAKSHA — shared core (identical block in every page)
     The offline + sync layers live in js/offline.js and js/sync.js,
     loaded after this script.
     ================================================================ */
  (function () {
    'use strict';
    var R = window.RAKSHA = window.RAKSHA || {};
    R.version = '1.1.0-offline';

    R.dispatch = function (name, detail) {
      window.dispatchEvent(new CustomEvent(name, { detail: detail || {} }));
    };
    R.onReady = function (fn) {
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
      else fn();
    };

    var PATHS = {

      if (!hasSidebar && menuBtn) { menuBtn.style.display = 'none'; }
      function closeSidebar() {
        document.body.classList.remove('sidebar-open');
        if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
        if (scrimEl) scrimEl.hidden = true;
      }
      if (menuBtn && hasSidebar) {
        menuBtn.addEventListener('click', function () {
          var open = document.body.classList.toggle('sidebar-open');
          menuBtn.setAttribute('aria-expanded', String(open));
          if (scrimEl) scrimEl.hidden = !open;

    function updateDataChip(detail) {
      var chip = document.getElementById('ra-data-chip');

      var online = R.offline ? R.offline.isOnline() : navigator.onLine;
      var mode = detail && detail.mode ? detail.mode : (R.api ? R.api.mode : 'demo');
      chip.hidden = false;
      if (!online) { chip.className = 'chip chip-off'; chip.textContent = 'OFFLINE DATA'; chip.title = 'No connection — data is served from the offline cache on this device.'; }
      else if (mode === 'live') { chip.className = 'chip chip-live'; chip.textContent = 'LIVE DATA'; chip.title = 'Connected to the RAKSHA backend.'; }
      else { chip.className = 'chip chip-demo'; chip.textContent = 'DEMO DATA'; chip.title = 'Backend not connected — the app is running on its built-in demo dataset.'; }

  /* ================================================================
     RAKSHA — API layer for this page (community resources)
     Online : LIVE API -> snapshot cache (rakshaDB via offline.js).
     Offline: snapshot view only — resource edits require a
              connection (buttons are gated; this is by design).
     ================================================================ */
  (function () {
    'use strict';
    var R = window.RAKSHA;

    var API_BASE = 'api';
    var LS_KEY = 'raksha.demo.v1';
    var DEMO_COMMUNITY_ID = '"650c1f1e2f8a1b0012345678"';

    var api = R.api = { mode: 'demo', lastSource: null };
    var readyPromise = null;

    var SEED_FOOD = [

      { id: 'food-002', name: 'Milk',                       category: 'Dairy',      quantity: 20, unit: 'L',  storageType: 'Refrigerated', status: 'CRITICAL', priority: 'Critical' },
      { id: 'food-003', name: 'Fresh vegetables',           category: 'Vegetables', quantity: 40, unit: 'kg', storageType: 'Ambient',      status: 'PROTECT',  priority: 'Medium' },
      { id: 'food-004', name: 'Meat & fish',                category: 'Meat',       quantity: 20, unit: 'kg', storageType: 'Frozen',       status: 'CRITICAL', priority: 'Critical' },
      { id: 'food-005', name: 'Frozen food',                category: 'Frozen',     quantity: 30, unit: 'kg', storageType: 'Frozen',       status: 'PRIORITY', priority: 'High' },
      { id: 'food-006', name: 'Rice & grains',              category: 'Grains',     quantity: 80, unit: 'kg', storageType: 'Ambient',      status: 'STABLE',   priority: 'Low' },
      { id: 'food-007', name: 'Canned food',                category: 'Canned',     quantity: 50, unit: 'kg', storageType: 'Ambient',      status: 'STABLE',   priority: 'Low' }
    ];

    var SEED_RESOURCES = [
      { id: 'res-001', name: 'Refrigerator A', type: 'Refrigerator', capacity: 50, unit: 'kg',    location: 'Community hall – kitchen',    powerSource: 'Grid',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community', poweredByGenerator: true },
      { id: 'res-002', name: 'Refrigerator B', type: 'Refrigerator', capacity: 50, unit: 'kg',    location: 'Shelter block C',             powerSource: 'Grid',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community', poweredByGenerator: false },
      { id: 'res-003', name: 'Freezer',        type: 'Freezer',      capacity: 40, unit: 'kg',    location: 'Community hall – kitchen',    powerSource: 'Grid',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community', poweredByGenerator: true },
      { id: 'res-004', name: 'Cold box',       type: 'Cold box',     capacity: 20, unit: 'kg',    location: 'Mobile / shelter block C',    powerSource: 'Ice',   operationalStatus: 'Operational', availability: 'Available', ownerType: 'NGO',       poweredByGenerator: false },
      { id: 'res-005', name: 'Generator',      type: 'Generator',    capacity: 1,  unit: 'units', location: 'Community hall',              powerSource: 'Fuel',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community' },
      { id: 'res-006', name: 'Ice stock',      type: 'Ice supply',   capacity: 20, unit: 'kg',    location: 'Community hall freezer room', powerSource: 'None',  operationalStatus: 'Operational', availability: 'Available', ownerType: 'Community' }
    ];

    function loadDemoState() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* ignore */ }
      return {
        food: JSON.parse(JSON.stringify(SEED_FOOD)),
        resources: JSON.parse(JSON.stringify(SEED_RESOURCES)),
        runs: {}, plans: {}, lastRunId: null, lastPlanRunId: null, seq: 100
      };
    }
    var demo = loadDemoState();
    function saveDemoState() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(demo)); } catch (e) { /* ignore */ }
    }
    function clone(o) { return JSON.parse(JSON.stringify(o)); }

    function fireMode() { R.dispatch('ra:apimode', { mode: api.mode }); }

    function request(method, path, body) {
      return fetch(API_BASE + path, {
        method: method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined
      }).then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (j) {
            throw new Error((j && j.error) || ('Request failed (' + res.status + ')'));
          });
        }
        return res.json();
      });
    }

    function detectMode() {
      var offline = R.offline && !R.offline.isOnline();
      if (offline) { api.mode = 'demo'; fireMode(); return Promise.resolve('demo'); }
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 2500);
      return fetch(API_BASE + '/health', { signal: ctrl.signal })
        .then(function (res) { api.mode = res.ok ? 'live' : 'demo'; })
        .catch(function () { api.mode = 'demo'; })
        .then(function () { clearTimeout(timer); fireMode(); return api.mode; });
    }
    function ensureReady() {
      if (!readyPromise) readyPromise = detectMode();
      return readyPromise;
    }
    window.addEventListener('ra:connectivity', function (e) {
      if (e.detail && e.detail.online) readyPromise = null;
    });

    function readChain(path, snapshotName, demoFn) {
      return ensureReady().then(function () {
        var online = R.offline.isOnline();
        if (online && api.mode === 'live') {
          return request('GET', path).then(function (data) {
            api.lastSource = 'live';
            if (R.offline) R.offline.cacheSnapshot(snapshotName, data);
            return data;
          }).catch(function () { api.mode = 'demo'; fireMode(); return fallback(); });
        }
        return fallback();
        function fallback() {
          var fromDemo = function () {
            var data = demoFn();
            api.lastSource = 'demo';
            if (R.offline && R.offline.isOnline()) R.offline.cacheSnapshot(snapshotName, data);
            return data;
          };
          if (!online && R.offline) {
            return R.offline.loadSnapshot(snapshotName).then(function (cached) {
              if (cached != null) { api.lastSource = 'cache'; return cached; }
              return fromDemo();
            });
          }
          return fromDemo();
        }
      });
    }

    function writeRemote(method, path, body, demoMutator) {
      return ensureReady().then(function () {
        if (R.offline && !R.offline.isOnline()) {
          throw new Error('Resource edits need an internet connection. Food inventory edits are the offline-editable surface in this prototype.');
        }
        if (api.mode === 'live') return request(method, path, body);
        var result = demoMutator();
        saveDemoState();
        return result;
      });
    }

    api.getResources = function () {
      /* GET /api/resources?communityId=... */
      return readChain('/resources?communityId=' + DEMO_COMMUNITY_ID, 'resources', function () { return clone(demo.resources); });
    };
    api.createResource = function (data) {
      /* POST /api/resources */
      return writeRemote('POST', '/resources', Object.assign({ communityId: DEMO_COMMUNITY_ID }, data), function () {
        var item = Object.assign({ id: 'res-' + (demo.seq++) }, data);
        demo.resources.push(item);
        return clone(item);
      });
    };
    api.updateResource = function (id, data) {
      /* PUT /api/resources/:id */
      return writeRemote('PUT', '/resources/' + id, data, function () {
        var item = demo.resources.filter(function (r) { return r.id === id; })[0];
        if (!item) throw new Error('Resource not found.');
        Object.assign(item, data, { id: id });
        return clone(item);
      });
    };
    api.deleteResource = function (id) {
      /* DELETE /api/resources/:id */
      return writeRemote('DELETE', '/resources/' + id, null, function () {
        demo.resources = demo.resources.filter(function (r) { return r.id !== id; });
        return { ok: true };
      });
    };

    api.resetDemoData = function () {
      try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
      location.reload();
    };
  })();

  /* ================================================================

      document.getElementById('res-meta').textContent =
        items.length + ' resources recorded for this community' +
        (!R.offline.isOnline() ? ' · offline (cached snapshot)' : '');

    function statusBadgeFor(r) {

      if (r.operationalStatus === 'Maintenance') return '<span class="badge st-priority">Maintenance</span>';

    function render() {

        }).join('');
      }
      renderChips();
      R.offline.applyGate();
    }

    function openDialog(item) {
      editingId = item ? item.id : null;
      document.getElementById('res-dialog-title').textContent = item ? 'Edit resource' : 'Add resource';
      document.getElementById('res-submit').textContent = item ? 'Save changes' : 'Save resource';
      document.getElementById('r-name').value = item ? item.name : '';
      document.getElementById('r-type').value = item ? item.type : 'Refrigerator';
      document.getElementById('r-capacity').value = item ? item.capacity : '';
      document.getElementById('r-unit').value = item ? item.unit : 'kg';
      document.getElementById('r-power').value = item ? item.powerSource : 'Grid';
      document.getElementById('r-location').value = item ? (item.location || '') : '';
      document.getElementById('r-opstatus').value = item ? item.operationalStatus : 'Operational';
      document.getElementById('r-avail').value = item ? item.availability : 'Available';
      document.getElementById('r-owner').value = item ? item.ownerType : 'Community';
      document.getElementById('r-gen').checked = !!item && !!item.poweredByGenerator;
      dialog.showModal();
      document.getElementById('r-name').focus();
    }

    function load() {
      return api.getResources().then(function (data) { items = data; render(); });
    }

    R.onReady(function () {
      document.getElementById('btn-add-res').addEventListener('click', function () { openDialog(null); });

      dialog.querySelectorAll('[data-close]').forEach(function (b) {
        b.addEventListener('click', function () { dialog.close(); });
      });
      dialog.addEventListener('click', function (e) { if (e.target === dialog) dialog.close(); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var payload = {
          name: document.getElementById('r-name').value.trim(),
          type: document.getElementById('r-type').value,
          capacity: Number(document.getElementById('r-capacity').value),
          unit: document.getElementById('r-unit').value,
          powerSource: document.getElementById('r-power').value,
          location: document.getElementById('r-location').value.trim(),
          operationalStatus: document.getElementById('r-opstatus').value,
          availability: document.getElementById('r-avail').value,
          ownerType: document.getElementById('r-owner').value,
          poweredByGenerator: document.getElementById('r-gen').checked
        };
        var submitBtn = document.getElementById('res-submit');
        submitBtn.classList.add('is-busy');
        var op = editingId ? api.updateResource(editingId, payload) : api.createResource(payload);
        op.then(function () {
          dialog.close();
          ui.toast('“' + payload.name + '” ' + (editingId ? 'updated' : 'added to community resources') + '.', 'success');
          return load();
        }).catch(function (err) {
          ui.toast(err.message, 'error');
        }).finally(function () { submitBtn.classList.remove('is-busy'); });
      });

      document.getElementById('res-tbody').addEventListener('click', function (e) {
        var editBtn = e.target.closest('.act-edit');
        var delBtn = e.target.closest('.act-del');
        if (editBtn) {
          var item = items.filter(function (r) { return r.id === editBtn.getAttribute('data-id'); })[0];
          if (item) openDialog(item);
        } else if (delBtn) {
          var id = delBtn.getAttribute('data-id');
          var target = items.filter(function (r) { return r.id === id; })[0];
          if (!target) return;
          ui.confirm({
            title: 'Delete resource?',
            message: '“' + target.name + '” will be removed from community resources. This cannot be undone.',
            confirmLabel: 'Delete', danger: true
          }).then(function (ok) {
            if (!ok) return;
            api.deleteResource(id).then(function () {
              ui.toast('“' + target.name + '” deleted.', 'success');
              return load();
            }).catch(function (err) { ui.toast(err.message, 'error'); });
          });
        }
      });

      window.addEventListener('ra:sync-queue', function () { /* nothing to refresh here — food only */ });

      load().catch(function (err) { ui.toast('Could not load resources: ' + err.message, 'error'); });
    });
  })();
  </script>

  <!-- Shared offline + sync layers (loaded after the page script) -->
  <script src="js/offline.js"></script>
  <script src="js/sync.js"></script>
</body>
</html>
